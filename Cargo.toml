[package]
name = "monitor-agent-freebsd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "FreeBSD monitoring agent for the monitor hub"
repository = "https://github.com/MaoShiSanKe/monitor-agent-freebsd"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A single-threaded runtime suffices: one report every few seconds plus a
# handful of TCP probes. Identical to the Linux agent's choice.
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# tokio-tungstenite 0.28 leaves the crypto provider to the caller: rustls
# selects one automatically only when exactly one provider feature is enabled.
# Without this the agent panics on its first wss:// connection.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# sysctl(3), getfsstat(2) and the socket-protocol walks live here; the
# collection layer has no other native dependency.
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
